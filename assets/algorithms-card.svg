  <title id="title">Dynamic programming and string search</title>
  <desc id="desc">Java algorithms with LCS and merge-plan reconstruction, tree independent sets, KMP, Rabin–Karp, suffix arrays, Aho–Corasick, and independent test oracles. A string-search diagram highlights overlapping matches.</desc>
