    <rect x="286" y="456" width="152" height="31" rx="7" fill="#FFBE58" fill-opacity="0.09" stroke="#A98A51"/>
    <g text-anchor="middle" font-size="18"><text x="118" y="478" fill="#B9F3FA">Original</text><text x="362" y="478" fill="#FFBE58">Reviewed</text></g>
    <path d="M206 472 H274 M267 467 L274 472 L267 477" fill="none" stroke="#FFBE58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
