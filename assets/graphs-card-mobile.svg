  <circle cx="184" cy="467" r="22" fill="#082334" stroke="#39c6df" stroke-width="2"/>
  <g font-family="Consolas, monospace" font-size="24" text-anchor="middle" fill="#f0fbfd"><text x="74" y="412">S</text><text x="184" y="368">A</text><text x="184" y="475">B</text><text x="302" y="388">C</text><text x="403" y="475">T</text></g>
</svg>
