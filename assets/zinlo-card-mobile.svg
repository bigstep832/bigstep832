    <text x="165.5" y="52" text-anchor="middle" font-size="18" font-weight="600" fill="#FFBE58">MVP</text>
    <g font-size="22" fill="#B9F3FA">
      <text x="28" y="103">Four-week learning sprints,</text>
      <text x="28" y="134">built around compatible teammates.</text>
    </g>
    <g fill="#39C6DF"><circle cx="32" cy="173" r="4"/><circle cx="32" cy="206" r="4"/><circle cx="32" cy="239" r="4"/></g>
    <g font-size="22" fill="#E4F4FB">
