      <text x="47" y="213">Private team chat &amp; WebRTC calls</text>
      <text x="47" y="246">Scheduled lessons &amp; progress</text>
    </g>
    <text x="28" y="286" font-size="22" fill="#A8CADA">React · Node.js · SQLite · WebRTC</text>

    <rect x="24" y="311" width="432" height="186" rx="14" fill="#0C3B58" stroke="#20617D"/>
    <text x="42" y="340" font-size="20" font-weight="600" fill="#B9F3FA">One shared schedule</text>
    <g fill="none" stroke="#39C6DF" stroke-opacity="0.45" stroke-width="2">
