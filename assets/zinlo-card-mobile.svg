<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="zinlo-mobile-title zinlo-mobile-desc">
  <title id="zinlo-mobile-title">Zinlo — collaborative learning MVP</title>
  <desc id="zinlo-mobile-desc">Four-week learning sprints, timezone-aware matchmaking, private team chat and WebRTC calls, and scheduled lessons and progress. React, Node.js, SQLite, and WebRTC. Below the description, three teammates connect to a shared calendar with two meetings per week for four weeks.</desc>
  <defs>
    <linearGradient id="zinlo-mobile-bg" x1="0" y1="0" x2="480" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#082334"/><stop offset="1" stop-color="#073456"/></linearGradient>
    <clipPath id="zinlo-mobile-clip"><rect width="480" height="520" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#zinlo-mobile-clip)" font-family="'Segoe UI', Arial, sans-serif">
