      <rect x="69" y="389" width="50" height="10" rx="4"/><rect x="166" y="389" width="50" height="10" rx="4"/><rect x="263" y="389" width="50" height="10" rx="4"/><rect x="360" y="389" width="50" height="10" rx="4"/>
      <rect x="69" y="407" width="50" height="10" rx="4"/><rect x="166" y="407" width="50" height="10" rx="4"/><rect x="263" y="407" width="50" height="10" rx="4"/><rect x="360" y="407" width="50" height="10" rx="4"/>
