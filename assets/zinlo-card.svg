      <text x="55" y="218">Private team chat &amp; WebRTC calls</text>
      <text x="55" y="251">Scheduled lessons &amp; progress</text>
    </g>
    <text x="34" y="290" font-size="16" fill="#A8CADA">React · Node.js · SQLite · WebRTC</text>

    <rect x="586" y="22" width="352" height="276" rx="16" fill="#0C3B58" stroke="#20617D"/>
    <text x="610" y="56" font-size="18" font-weight="600" fill="#B9F3FA">One shared schedule</text>
    <g fill="none" stroke="#39C6DF" stroke-opacity="0.45" stroke-width="2">
