<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="zinlo-title zinlo-desc">
  <title id="zinlo-title">Zinlo — collaborative learning MVP</title>
  <desc id="zinlo-desc">Four-week learning sprints with timezone-aware matchmaking, private team chat and WebRTC calls, and scheduled lessons and progress. Built with React, Node.js, SQLite, and WebRTC. A schematic connects three teammates to a shared calendar with two meetings in each of four weeks.</desc>
  <defs>
    <linearGradient id="zinlo-bg" x1="0" y1="0" x2="960" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082334"/>
      <stop offset="1" stop-color="#073456"/>
    </linearGradient>
    <clipPath id="zinlo-clip"><rect width="960" height="320" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#zinlo-clip)" font-family="'Segoe UI', Arial, sans-serif">
    <rect width="960" height="320" fill="url(#zinlo-bg)"/>
    <path d="M0 307 C160 282 255 327 418 308 S720 285 960 308" fill="none" stroke="#39C6DF" stroke-opacity="0.13" stroke-width="2"/>
    <text x="34" y="64" font-size="36" font-weight="700" fill="#F1FDFF">Zinlo</text>
    <rect x="139" y="37" width="56" height="28" rx="14" fill="#FFBE58" fill-opacity="0.12"/>
    <text x="167" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#FFBE58">MVP</text>
    <text x="34" y="107" font-size="20" fill="#B9F3FA">Four-week learning sprints,</text>
    <text x="34" y="135" font-size="20" fill="#B9F3FA">built around compatible teammates.</text>
